
name: Build Windows 11 Desktop Application

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install chromium

      - name: Build Standalone EXE
        run: python -m PyInstaller --noconfirm mewe_autofollow.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Compile Installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" inno_setup.iss'

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: MeWe_AutoFollow_Windows11_Setup
          path: release/MeWe_AutoFollow_Setup.exe
